name: kalig_onan_evac_system
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  provider: ^6.1.0
  uuid: ^4.0.0
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.12.0
  flutter_riverpod: ^3.3.1
  mapbox_maps_flutter: ^2.20.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  location: ^8.0.1
  go_router: ^17.1.0
  connectivity_plus: ^5.0.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_charts: ^33.1.47

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/map_icons/
    - assets/app_icons/

flutter_icons:
  android: true
  
  image_path: "assets/app_icons/official-icon.png" 
  
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/app_icons/official-icon.png"

flutter_native_splash:
  color: "#FFFFFF" 
  image: assets/app_icons/official-icon.png
  
  android_12:
    image: assets/app_icons/official-icon.png
    color: "#FFFFFF"
    
  android: true
  ios: true